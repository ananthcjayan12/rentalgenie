<!-- Shared Portal Header Component -->
<header class="portal-header">
    <div class="header-content">
        <a href="/portal" class="logo">
            <i class="fas fa-gem"></i> Blush & Glow
        </a>
        
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" class="search-input" placeholder="Search for jewellery" 
                   x-model="searchQuery" @input="searchItems()">
        </div>
        
        <div class="header-actions">
            <a href="/portal/staff" class="nav-icon" title="Staff Dashboard">
                <i class="fas fa-tachometer-alt"></i>
            </a>
            <a href="/portal/cart" class="cart-icon">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-badge" x-show="cartCount > 0" x-text="cartCount"></span>
            </a>
            <a href="/portal/profile" class="user-icon">
                <i class="fas fa-user"></i>
            </a>
        </div>
    </div>
</header>
